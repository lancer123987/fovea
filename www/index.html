    <script>
        let isFirst = sessionStorage.getItem('is_first') === null ? '1' : '0';
        isFirst = +isFirst;
        jQuery(function () {
            /* loading */
            let $html = jQuery('html');
            if (isFirst) {
                $html.addClass('ready');
            } else {
                $html.removeClass('loading');
                jQuery('.j-loading').remove();
            }

            $html.on('click', '.j-loading-bt', function () {
                $html.removeClass('loading');
                sessionStorage.setItem('is_first', 0);
            });

            /* banner滑鼠位置偵測 */
            if (!touchSupport) {
                let isBannerVisible = false;
                observable.init({
                    target: '.j-banner',
                    onEnter: (el) => {
                        isBannerVisible = true;
                    },
                    onLeave: (el) => {
                        isBannerVisible = false;
                    }
                });

                /* 儲存滑鼠的目標位置與當前平滑位置 */
                let targetX = 0,
                    targetY = 0,
                    currentX = 0,
                    currentY = 0,
                    isAnimating = false;

                /* 計算並更新位置 */
                function updateBannerPosition() {
                    if (!isBannerVisible) {
                        isAnimating = false;
                        return;
                    }

                    /* 延遲程度，數值越小越慢）*/
                    let ease = 0.05;
                    currentX += (targetX - currentX) * ease;
                    currentY += (targetY - currentY) * ease;

                    let $banner = jQuery('.j-banner')[0];
                    if ($banner) {
                        $banner.style.setProperty('--x', currentX);
                        $banner.style.setProperty('--y', currentY);
                    }

                    /* 持續在畫面更新時循環計算 */
                    requestAnimationFrame(updateBannerPosition);
                }

                window.addEventListener('pointermove', function (e) {
                    if (991 >= window.innerWidth) return;
                    if (!isBannerVisible) return;

                    let $banner = jQuery('.j-banner')[0];
                    if (!$banner) return;

                    let rect = $banner.getBoundingClientRect(),
                        centerX = rect.width / 2,
                        centerY = rect.height / 2;

                    /* 計算相對於中心的座標 */
                    targetX = e.clientX - rect.left - centerX;
                    targetY = e.clientY - rect.top - centerY;

                    if (!isAnimating) {
                        isAnimating = true;
                        requestAnimationFrame(updateBannerPosition);
                    }
                });
            }
        });
    </script>
